[workspace]
resolver = "3"
members = ["crates/verimap-kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Input-driven code returns typed errors; tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# No silent numeric truncation or sign changes.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
# Overflow is an error everywhere, including release and WASM builds.
overflow-checks = true
